<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>五面性格 · 大五人格自我探索</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    :root {
      color-scheme: light;
      --paper: #f6f5ef;
      --ink: #202b28;
      --muted: #747d76;
      --line: #dedfd6;
      --green: #355f4b;
      --green-pale: #e4eee6;
      --orange: #e27d52;
      --yellow: #e8c75e;
      --blue: #708ca1;
      --pink: #c97b83;
      --white: #fffefa;
      font-family: 'DM Sans', 'Noto Sans SC', sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d9ddd3 0.65px, transparent 0.65px);
      background-size: 15px 15px;
    }
    button { font: inherit; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 42px 44px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; letter-spacing: 0; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: white; font-size: 14px; }
    .top-note { color: var(--muted); font-size: 12px; letter-spacing: 0; }
    main { padding-top: 40px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 9px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.2; letter-spacing: 0; }
    .intro-copy { max-width: 360px; margin: 0 0 2px; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
    .panel { background: var(--white); border: 1px solid #e8e7df; border-radius: 8px; }
    .question-panel { min-height: 420px; padding: 28px 32px 24px; display: flex; flex-direction: column; }
    .progress-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .progress-count { color: var(--ink); font-weight: 700; }
    .progress-track { height: 4px; margin-top: 12px; overflow: hidden; border-radius: 5px; background: #e9e9e2; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width 240ms ease; }
    .question-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px 0 22px; }
    .dimension-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dimension-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    h2 { max-width: 640px; margin: 17px 0 26px; font-size: clamp(22px, 3vw, 29px); line-height: 1.5; font-weight: 600; letter-spacing: 0; }
    .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; }
    .choice { position: relative; min-height: 67px; padding: 9px 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); color: var(--muted); cursor: pointer; transition: border-color 150ms ease, background 150ms ease, transform 150ms ease; }
    .choice:hover { border-color: #9baa9c; transform: translateY(-2px); }
    .choice[aria-pressed="true"] { border-color: var(--green); background: var(--green-pale); color: var(--green); }
    .choice strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 17px; }
    .choice span { display: block; font-size: 10px; white-space: normal; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; border-top: 1px solid #eeede7; }
    .nav-hint { color: var(--muted); font-size: 11px; }
    .nav-actions { display: flex; gap: 8px; }
    .btn { min-height: 39px; padding: 0 16px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 600; transition: background 150ms ease, border-color 150ms ease; }
    .btn:hover:not(:disabled) { border-color: #a8b1a7; background: #f7f8f2; }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .btn-primary { border-color: var(--green); background: var(--green); color: white; }
    .btn-primary:hover:not(:disabled) { border-color: #294d3b; background: #294d3b; }
    .side { padding: 22px 20px; }
    .side-title { margin: 0 0 17px; font-size: 13px; font-weight: 700; }
    .trait-list { display: grid; gap: 13px; }
    .trait-row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 9px; font-size: 11px; }
    .trait-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--trait-color); }
    .trait-row .trait-name { color: #4a544e; }
    .trait-row .trait-state { color: #959b94; font-size: 10px; }
    .side-divider { height: 1px; margin: 19px 0 16px; background: #eeede7; }
    .privacy { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
    .privacy strong { color: #4a544e; font-weight: 600; }
    .result-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
    .result-copy { padding: 27px 29px; }
    .result-copy h2 { margin: 0 0 8px; font-size: 22px; }
    .result-intro { margin: 0 0 21px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .result-trait { padding: 15px 0; border-top: 1px solid #eeede7; }
    .result-trait:first-child { border-top: 0; }
    .result-trait-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .result-trait-name { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; }
    .result-score { font-size: 12px; font-weight: 700; color: var(--trait-color); }
    .result-trait p { margin: 7px 0 0 18px; color: var(--muted); font-size: 11px; line-height: 1.75; }
    .chart-panel { padding: 21px 19px 17px; text-align: center; }
    .chart-panel h3 { margin: 0; font-size: 13px; }
    .chart-panel p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .chart-legend { display: flex; justify-content: center; gap: 16px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 20px; border-top: 2px solid var(--green); }
    .legend-average { border-top-color: var(--orange); border-top-style: dashed; }
    canvas { display: block; width: 100%; max-width: 290px; height: auto; margin: 12px auto 0; }
    .result-actions { display: flex; gap: 9px; margin-top: 20px; }
    .result-actions .btn { flex: 1; }
    .disclaimer { margin: 16px 2px 0; color: #858b83; font-size: 10px; line-height: 1.7; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    button:focus-visible { outline: 3px solid #a4bb9e; outline-offset: 3px; }
    @media (max-width: 760px) {
      .shell { padding: 19px 17px 30px; }
      .topbar { padding-bottom: 16px; }
      .top-note { font-size: 10px; }
      main { padding-top: 28px; }
      .intro { display: block; margin-bottom: 20px; }
      .intro-copy { margin-top: 11px; }
      .layout, .result-layout { grid-template-columns: 1fr; }
      .question-panel { min-height: 400px; padding: 22px 18px 18px; }
      .side { padding: 18px; }
      .trait-list { grid-template-columns: 1fr 1fr; }
      .result-copy { padding: 22px 19px; }
      .chart-panel { max-width: 420px; width: 100%; justify-self: center; }
    }
    @media (max-width: 420px) {
      .scale { gap: 5px; }
      .choice { min-height: 64px; padding-inline: 2px; }
      .choice span { font-size: 9px; }
      .question-panel { min-height: 390px; }
      .nav-hint { max-width: 110px; line-height: 1.5; }
      .btn { padding-inline: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">五</span><span>五面性格</span></div>
      <span class="top-note">一份关于自己的小小观察</span>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div><p class="eyebrow">THE BIG FIVE · SELF-REFLECTION</p><h1 id="page-title">认识自己的五个侧面</h1></div>
        <p class="intro-copy">没有标准答案，也没有好坏之分。请按最近一段时间的真实状态作答，而不是理想中的自己。</p>
      </section>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <script>
    const traits = [
      { key: 'openness', name: '开放性', en: '好奇与想象', color: '#708ca1', average: 3.6, low: '你更偏好熟悉、具体且经过验证的方式，重视稳定与实用。', high: '你容易被新想法吸引，乐于探索不同视角、体验与可能性。' },
      { key: 'conscientiousness', name: '尽责性', en: '计划与执行', color: '#e27d52', average: 3.65, low: '你更倾向于保持弹性，临场调整比严格遵循计划更自然。', high: '你通常有条理、重承诺，愿意为目标持续投入并留意细节。' },
      { key: 'extraversion', name: '外向性', en: '活力与社交', color: '#e8b94f', average: 3.4, low: '独处和小范围交流常能为你恢复能量，你更习惯先观察再参与。', high: '互动与热闹的环境容易带给你能量，你往往主动表达和参与。' },
      { key: 'agreeableness', name: '宜人性', en: '合作与体谅', color: '#c97b83', average: 3.8, low: '你重视直接与独立判断，必要时会坦率表达不同意见。', high: '你倾向于体察他人感受、寻求合作，并愿意给予信任与支持。' },
      { key: 'neuroticism', name: '神经质', en: '感受与压力', color: '#7c8871', average: 3, low: '面对压力时你通常较为平稳，不容易被短暂波动牵动。', high: '你对压力和情绪线索较敏锐，感受丰富，也可能更容易担忧。' }
    ];
    const questions = [
      ['我会主动尝试新的活动或体验。', 'openness', false],
      ['我会提前安排事情，并按计划推进。', 'conscientiousness', false],
      ['在一群人中，我通常愿意先开口交谈。', 'extraversion', false],
      ['我会留意自己的话是否让别人感到难受。', 'agreeableness', false],
      ['遇到突发状况时，我容易感到紧张。', 'neuroticism', false],
      ['我对抽象或复杂的想法感到好奇。', 'openness', false],
      ['我常常把事情拖到最后一刻才做。', 'conscientiousness', true],
      ['长时间独处后，我会想找人聊聊。', 'extraversion', false],
      ['即使意见不同，我也会努力理解对方的立场。', 'agreeableness', false],
      ['我会反复担心已经发生或尚未发生的事。', 'neuroticism', false],
      ['我喜欢用新角度看待熟悉的问题。', 'openness', false],
      ['我做事时会仔细检查容易忽略的细节。', 'conscientiousness', false],
      ['在社交场合，我通常比较健谈。', 'extraversion', false],
      ['比起争个输赢，我更愿意寻找双方都能接受的办法。', 'agreeableness', false],
      ['即使是小挫折，也可能让我低落一阵子。', 'neuroticism', false],
      ['我喜欢接触与自己日常不同的文化或观点。', 'openness', false],
      ['我有时会忘记自己答应过要完成的事。', 'conscientiousness', true],
      ['我在活动中常会带动气氛。', 'extraversion', false],
      ['别人需要帮忙时，我通常愿意伸出援手。', 'agreeableness', false],
      ['情绪起伏有时会影响我一整天的状态。', 'neuroticism', false],
      ['我能享受需要想象力的事情，例如写作或构思。', 'openness', false],
      ['开始一项任务前，我通常会想清楚步骤。', 'conscientiousness', false],
      ['和不太熟悉的人交流对我来说并不困难。', 'extraversion', false],
      ['我相信大多数人是出于善意行事的。', 'agreeableness', false],
      ['面对不确定的结果，我很难完全放松。', 'neuroticism', false]
    ];
    const scaleLabels = ['很不符合', '不太符合', '一般', '比较符合', '很符合'];
    const answers = Array(questions.length).fill(null);
    let current = 0;
    let advanceTimer;
    const app = document.querySelector('#app');
    const traitFor = key => traits.find(trait => trait.key === key);

    function renderQuestion() {
      clearTimeout(advanceTimer);
      const [, traitKey] = questions[current];
      const trait = traitFor(traitKey);
      const doneTraits = new Set(questions.slice(0, current).map(question => question[1]));
      app.innerHTML = `
        <div class="layout">
          <section class="panel question-panel" aria-labelledby="question-title">
            <div class="progress-head"><span>作答进度</span><span class="progress-count">${current + 1} <span aria-hidden="true">/</span> ${questions.length}</span></div>
            <div class="progress-track" role="progressbar" aria-label="作答进度" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${current}"><div class="progress-fill" style="width:${current / questions.length * 100}%"></div></div>
            <div class="question-body">
              <div class="dimension-label"><span class="dimension-dot" style="background:${trait.color}"></span>${trait.name} · ${trait.en}</div>
              <h2 id="question-title">${questions[current][0]}</h2>
              <div class="scale" role="group" aria-label="请选择符合程度">${scaleLabels.map((label, index) => `<button class="choice" type="button" aria-pressed="${answers[current] === index + 1}" data-answer="${index + 1}"><strong>${index + 1}</strong><span>${label}</span></button>`).join('')}</div>
            </div>
            <div class="nav"><span class="nav-hint">选择后自动进入下一题</span><div class="nav-actions"><button class="btn" id="prev" type="button" ${current === 0 ? 'disabled' : ''}>上一步</button></div></div>
          </section>
          <aside class="panel side" aria-label="测评说明"><h2 class="side-title">五个观察维度</h2><div class="trait-list">${traits.map(item => `<div class="trait-row"><span class="dot" style="--trait-color:${item.color}"></span><span class="trait-name">${item.name}</span><span class="trait-state">${doneTraits.has(item.key) ? '已遇见' : '待探索'}</span></div>`).join('')}</div><div class="side-divider"></div><p class="privacy"><strong>只为自我觉察</strong><br>答案仅保存在当前页面，不会上传或储存到服务器。测评结果不用于诊断。</p></aside>
        </div>`;
      app.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click', () => {
        const answeredQuestion = current;
        clearTimeout(advanceTimer);
        answers[answeredQuestion] = Number(button.dataset.answer);
        app.querySelectorAll('[data-answer]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
        advanceTimer = setTimeout(() => {
          if (current !== answeredQuestion) return;
          if (current < questions.length - 1) { current++; renderQuestion(); }
          else renderResults();
        }, 350);
      }));
      app.querySelector('#prev').addEventListener('click', () => { if (current > 0) { current--; renderQuestion(); } });
    }

    function calculateScores() {
      return traits.map(trait => {
        const values = questions.map((question, index) => question[1] === trait.key ? (question[2] ? 6 - answers[index] : answers[index]) : null).filter(value => value !== null);
        return { ...trait, score: values.reduce((sum, value) => sum + value, 0) / values.length };
      });
    }

    function drawChart(scores) {
      const canvas = document.querySelector('#radar');
      const context = canvas.getContext('2d');
      const ratio = window.devicePixelRatio || 1;
      const width = 300;
      const height = 300;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      context.scale(ratio, ratio);
      const center = { x: width / 2, y: height / 2 };
      const radius = 92;
      const angles = scores.map((_, index) => -Math.PI / 2 + index * 2 * Math.PI / scores.length);
      context.font = "11px 'Noto Sans SC', sans-serif";
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      for (let ring = 1; ring <= 5; ring++) {
        const ringRadius = radius * ring / 5;
        context.beginPath();
        angles.forEach((angle, index) => {
          const x = center.x + Math.cos(angle) * ringRadius;
          const y = center.y + Math.sin(angle) * ringRadius;
          index === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
        });
        context.closePath();
        context.strokeStyle = ring === 5 ? '#d9ddd3' : '#e9ebe5';
        context.lineWidth = 1;
        context.stroke();
      }
      angles.forEach(angle => {
        context.beginPath();
        context.moveTo(center.x, center.y);
        context.lineTo(center.x + Math.cos(angle) * radius, center.y + Math.sin(angle) * radius);
        context.strokeStyle = '#e2e5dd';
        context.stroke();
      });
      context.beginPath();
      scores.forEach((item, index) => {
        const value = (item.average - 1) / 4;
        const x = center.x + Math.cos(angles[index]) * radius * value;
        const y = center.y + Math.sin(angles[index]) * radius * value;
        index === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
      });
      context.closePath();
      context.fillStyle = 'rgba(226, 125, 82, .06)';
      context.fill();
      context.strokeStyle = '#e27d52';
      context.lineWidth = 2;
      context.setLineDash([5, 4]);
      context.stroke();
      context.setLineDash([]);
      context.beginPath();
      scores.forEach((item, index) => {
        const value = (item.score - 1) / 4;
        const x = center.x + Math.cos(angles[index]) * radius * value;
        const y = center.y + Math.sin(angles[index]) * radius * value;
        index === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
      });
      context.closePath();
      context.fillStyle = 'rgba(77, 125, 91, .20)';
      context.strokeStyle = '#355f4b';
      context.lineWidth = 2;
      context.fill();
      context.stroke();
      scores.forEach((item, index) => {
        const x = center.x + Math.cos(angles[index]) * radius * ((item.score - 1) / 4);
        const y = center.y + Math.sin(angles[index]) * radius * ((item.score - 1) / 4);
        context.beginPath();
        context.arc(x, y, 4, 0, Math.PI * 2);
        context.fillStyle = item.color;
        context.fill();
        const labelRadius = radius + 24;
        const labelX = center.x + Math.cos(angles[index]) * labelRadius;
        const labelY = center.y + Math.sin(angles[index]) * labelRadius;
        context.fillStyle = '#59645d';
        context.fillText(item.name, labelX, labelY);
      });
    }

    function renderResults() {
      const scores = calculateScores();
      app.innerHTML = `
        <div class="result-layout">
          <section class="panel result-copy" aria-labelledby="result-title">
            <p class="eyebrow">YOUR PERSONALITY SNAPSHOT</p><h2 id="result-title">你的五维观察结果</h2>
            <p class="result-intro">分数呈现的是倾向，不是定论。每一面都会随情境、经验与阶段而变化。</p>
            <div>${scores.map(item => {
              const level = item.score < 2.5 ? '相对较低' : item.score > 3.5 ? '相对较高' : '中间区间';
              const description = item.score < 2.5 ? item.low : item.score > 3.5 ? item.high : '你的整体倾向接近中间水平；不同情境下可能呈现两侧特征，较难用单一偏好概括。';
              return `<article class="result-trait" style="--trait-color:${item.color}"><div class="result-trait-head"><div class="result-trait-name"><span class="dot" style="--trait-color:${item.color}"></span>${item.name}</div><span class="result-score">${level} · ${item.score.toFixed(1)} / 5</span></div><p>${description}</p></article>`;
            }).join('')}</div>
            <div class="result-actions"><button class="btn" id="back-to-answers" type="button">返回修改</button><button class="btn btn-primary" id="restart" type="button">重新测一次</button></div>
            <p class="disclaimer">本页面为非正式自我探索工具，不是标准化心理测验，也不能替代专业评估或心理健康服务。</p>
          </section>
          <aside class="panel chart-panel"><h3>五维分布</h3><p>你的得分与参考均值对照</p><canvas id="radar" width="300" height="300" role="img" aria-label="五维人格得分与参考均值雷达图"></canvas><div class="chart-legend" aria-label="图例"><span><i class="legend-swatch"></i>你的得分</span><span><i class="legend-swatch legend-average"></i>参考均值</span></div></aside>
        </div>`;
      drawChart(scores);
      app.querySelector('#back-to-answers').addEventListener('click', () => { current = questions.length - 1; renderQuestion(); });
      app.querySelector('#restart').addEventListener('click', () => { answers.fill(null); current = 0; renderQuestion(); });
    }

    renderQuestion();
  </script>
</body>
</html>
